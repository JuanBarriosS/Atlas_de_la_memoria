<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <!-- Círculo de fondo opcional (puedes quitarlo si prefieres el mapa solo) -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="#102832" stroke-width="4" stroke-dasharray="10 20" opacity="0.3"/>

  <!-- Silueta de Colombia (Path mejorado con más detalle geográfico) -->
  <path 
    d="M150 120 L180 100 L220 110 L250 90 L280 100 L310 80 L340 100 L360 130 L350 160 L380 180 L400 210 L390 240 L410 270 L400 300 L380 320 L390 350 L370 380 L340 390 L320 420 L290 430 L270 410 L240 420 L210 400 L190 380 L160 370 L140 340 L110 330 L90 300 L100 270 L80 240 L90 210 L70 180 L90 150 L120 140 L150 120 Z" 
    fill="#102832" 
    stroke="#102832" 
    stroke-width="2" 
    stroke-linejoin="round"
  />

  <!-- Líneas topográficas (opcionales, para dar textura) -->
  <g stroke="#E9E5D9" stroke-width="1.5" stroke-linecap="round" opacity="0.6" clip-path="url(#colombia-clip)">
    <path d="M100 180 Q200 200 300 180 T400 220"/>
    <path d="M100 220 Q200 240 300 220 T400 260"/>
    <path d="M120 260 Q220 280 320 260 T400 300"/>
    <path d="M140 300 Q240 320 340 300 T400 340"/>
    <path d="M180 340 Q260 360 360 340"/>
  </g>

  <!-- Brújula (opcional) -->
  <g fill="#A68A55">
    <path d="M250 20 L260 70 L250 80 L240 70 Z"/> <!-- Norte -->
    <path d="M250 480 L240 430 L250 420 L260 430 Z"/> <!-- Sur -->
    <path d="M20 250 L70 240 L80 250 L70 260 Z"/> <!-- Oeste -->
    <path d="M480 250 L430 260 L420 250 L430 240 Z"/> <!-- Este -->
  </g>
</svg>
